[package]
name = "lattice"
version = "0.1.0"
edition = "2021"
description = "Orpheus — Loom VM, Latte language, Facet/Hymn web, and SCArs, with a content-addressed distributed runtime"

[[bin]]
name = "latte"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Intentionally ZERO dependencies: the whole trusted base is in this repo.
[dependencies]
