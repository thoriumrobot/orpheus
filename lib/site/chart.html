<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orpheus · Charts</title>
<style>
 body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin:0; background:#d8d4c8; color:#1a1a1a; }
 header { background:#1a1a2e; color:#f4f1e8; padding:8px 14px; font-size:14px; display:flex; justify-content:space-between; }
 header a { color:#bcd; text-decoration:none; margin-left:14px; }
 .panel { background:#f4f1e8; border:1px solid #1a1a2e; margin:8px; }
 .title { background:#c9c4b4; border-bottom:1px solid #1a1a2e; padding:4px 10px; font-size:12px; font-weight:600; }
 .body { padding:12px; }
 input { font:14px ui-monospace,monospace; padding:6px; width:60%; border:1px solid #1a1a2e; background:#fff; }
 button { font:13px ui-monospace,monospace; border:1px solid #1a1a2e; background:#e8e4d8; cursor:pointer; padding:6px 12px; margin:0 2px; }
 button:hover { background:#fff; }
 #out { margin-top:14px; background:#fff; border:1px solid #c9c4b4; display:inline-block; }
 .hint { color:#555; font-size:12px; margin-top:8px; }
 code { background:#e8e4d8; padding:0 3px; }
</style></head>
<body>
<header>
  <span>Orpheus · Charts &nbsp;—&nbsp; data visualization (lib/plot.lat → SVG)</span>
  <span><a href="/">System</a><a href="/editor">Editor</a></span>
</header>
<div class="panel">
  <div class="title">Data — space-separated numbers</div>
  <div class="body">
    <input id="data" value="3 1 4 1 5 9 2 6" spellcheck="false">
    <div style="margin-top:10px">
      <button onclick="draw('bar')">Bar</button>
      <button onclick="draw('line')">Line</button>
      <button onclick="draw('scatter')">Scatter</button>
    </div>
    <div id="out"></div>
    <div class="hint">The layout (scaling values to pixel geometry) is computed by <code>lib/plot.lat</code>
      on Loom; Hymn serializes it to SVG. Same engine as the CLI: <code>latte chart line 3 1 4 1 5</code>.</div>
  </div>
</div>
<script>
var out = document.getElementById('out');
function draw(kind){
  var nums = document.getElementById('data').value.trim();
  fetch('/api/plot', {method:'POST', headers:{'Content-Type':'text/plain'}, body: kind + ' ' + nums})
    .then(function(r){ return r.text(); })
    .then(function(svg){ out.innerHTML = svg; });
}
window.addEventListener('load', function(){ draw('bar'); });
</script>
</body></html>
