<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orpheus · Finance</title>
<style>
 body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin:0; background:#d8d4c8; color:#1a1a1a; }
 header { background:#1a1a2e; color:#f4f1e8; padding:8px 14px; font-size:14px; display:flex; justify-content:space-between; }
 header a { color:#bcd; text-decoration:none; margin-left:14px; }
 .panel { background:#f4f1e8; border:1px solid #1a1a2e; margin:8px; }
 .title { background:#c9c4b4; border-bottom:1px solid #1a1a2e; padding:4px 10px; font-size:12px; font-weight:600; }
 .body { padding:12px; }
 button { font:13px ui-monospace,monospace; border:1px solid #1a1a2e; background:#e8e4d8; cursor:pointer; padding:6px 12px; }
 button:hover { background:#fff; }
 input[type=range] { vertical-align:middle; }
 table.m { border-collapse:collapse; margin:8px 0; }
 table.m td { border:1px solid #c9c4b4; padding:3px 10px; font-size:13px; }
 table.m td:first-child { color:#444; background:#efeadd; }
 .svgbox { margin-top:10px; background:#fff; border:1px solid #c9c4b4; display:inline-block; }
 .note { color:#444; font-size:12px; max-width:680px; line-height:1.5; }
 #status { color:#666; font-size:12px; margin-left:10px; }
</style></head>
<body>
<header>
  <span>Orpheus · Finance &nbsp;—&nbsp; machine learning on BTC/USD — Bitcoin (lib/fin.lat)</span>
  <span><a href="/">System</a><a href="/chart">Charts</a><a href="/gpu">GPU</a><a href="/editor">Editor</a></span>
</header>
<div class="panel">
  <div class="title">BTC/USD volatility-regime model — trained on Loom, in Latte</div>
  <div class="body">
    epochs <input id="iters" type="range" min="20" max="300" step="20" value="80" oninput="ep.textContent=this.value">
    <span id="ep">80</span>
    <button onclick="run()">Train &amp; evaluate</button>
    <span id="status"></span>
    <div id="out" style="margin-top:12px">click <b>Train &amp; evaluate</b> to run the pipeline…</div>
  </div>
</div>
<script>
function run(){
  var iters = document.getElementById('iters').value;
  var status = document.getElementById('status');
  status.textContent = 'training on Loom…';
  fetch('/api/fin', {method:'POST', headers:{'Content-Type':'text/plain'}, body: iters})
    .then(function(r){ return r.text(); })
    .then(function(html){ document.getElementById('out').innerHTML = html; status.textContent=''; })
    .catch(function(e){ status.textContent = 'error'; });
}
window.addEventListener('load', run);
</script>
</body></html>
