<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orpheus · System</title>
<style>
 :root{
   --bg:#d6d2c4; --ink:#22222e; --paper:#faf8f1; --title:#cfcaba; --titlemark:#b9bce0;
   --btn:#ece8dc; --accent:#33387e; --rule:#8e8a7a; --dim:#6b6858; --cmd:#1d3a8f;
   --obj:#ffffff; --lh:20px;
 }
 *{box-sizing:border-box}
 html,body{height:100%}
 body{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;margin:0;
      background:var(--bg);color:var(--ink);font-size:13px}
 header{background:linear-gradient(#262633,#1c1c26);color:#e8e6dc;padding:7px 14px;
        display:flex;justify-content:space-between;align-items:center;font-size:13px;
        letter-spacing:.3px;border-bottom:2px solid var(--accent);box-shadow:0 1px 6px #0004}
 header b{font-weight:600;color:#cfd3ff}
 header .links a{color:#c9c4e8;text-decoration:none;margin-left:11px;padding:2px 4px;border-radius:3px}
 header .links a:hover{background:#ffffff22}
 header .links a.pg{color:#8f8cae;font-size:11px;margin-left:2px}
 #screen{display:flex;height:calc(100vh - 36px);padding:5px;gap:0}
 .track{display:flex;flex-direction:column;min-width:120px;height:100%}
 #userTrack{flex:62 1 0}
 #sysTrack{flex:38 1 0}
 .tsep{flex:0 0 7px;cursor:col-resize;position:relative}
 .tsep::after{content:'';position:absolute;left:2px;top:0;bottom:0;width:3px;border-radius:2px;background:#a9a494}
 .tsep:hover::after{background:var(--accent)}
 .vsep{flex:0 0 7px;cursor:row-resize;position:relative}
 .vsep::after{content:'';position:absolute;top:2px;left:0;right:0;height:3px;border-radius:2px;background:#a9a494}
 .vsep:hover::after{background:var(--accent)}
 .viewer{display:flex;flex-direction:column;min-height:64px;background:var(--paper);
         border:1px solid var(--rule);border-radius:3px;flex:1 1 0;overflow:hidden;
         box-shadow:0 1px 3px #00000022}
 .viewer.grown{flex:8 1 0}
 .menu{display:flex;align-items:center;background:linear-gradient(var(--title),#c4bfae);
       border-bottom:1px solid var(--rule);padding:3px 7px;font-size:12px;cursor:default;
       user-select:none;flex-wrap:wrap;min-height:24px}
 .viewer.marked .menu{background:linear-gradient(var(--titlemark),#a6aad6)}
 .menu .name{font-weight:700;margin-right:10px;white-space:nowrap;color:#1c1c30}
 .menu .star{margin-right:6px;width:12px;display:inline-block;text-align:center;color:var(--accent)}
 .menu .cmd{color:var(--cmd);cursor:pointer;padding:0 7px;border-left:1px solid #aaa594}
 .menu .cmd:first-of-type{border-left:0}
 .menu .cmd:hover{background:#ffffffcc;text-decoration:underline;border-radius:2px}
 .menu .spacer{flex:1}
 .body{flex:1;min-height:0;display:flex}
 /* A SOURCE frame: plain editable text (modules, raw markdown). */
 textarea.frame{flex:1;width:100%;border:0;margin:0;padding:7px 9px;resize:none;outline:none;
       font-family:inherit;font-size:13px;line-height:var(--lh);
       background:var(--paper);color:var(--ink);white-space:pre;overflow:auto}
 /* A TEXT frame: an editable text whose lines are commands and whose body can
    hold EMBEDDED DYNAMIC OBJECTS inline — Oberon's texts-with-elements. */
 .richtext{flex:1;overflow:auto;padding:7px 10px;background:var(--paper);line-height:var(--lh);
           outline:none;white-space:pre-wrap;word-break:break-word}
 .richtext div{min-height:var(--lh)}
 .richtext .obj{margin:7px 0 9px 14px;padding:6px;border:1px solid #cdc7b4;border-radius:3px;
                background:var(--obj);display:block;max-width:calc(100% - 28px);overflow:auto;
                box-shadow:0 1px 2px #00000014;user-select:none;white-space:normal}
 .richtext .obj::before{content:'⚙ ' attr(data-cmd);display:block;font-size:10px;color:#8a8676;
                margin:0 0 4px 1px;letter-spacing:.2px}
 .richtext .obj svg{display:block;max-width:100%;height:auto}
 /* The Log and tool-output viewers (read-only rich streams). */
 .richlog{flex:1;overflow:auto;padding:7px 9px;background:#fdfcf7;line-height:var(--lh)}
 .richlog .ln{white-space:pre-wrap;min-height:var(--lh);cursor:default;border-radius:2px}
 .richlog .ln:hover{background:#f1eedd}
 .richlog .ln.echo{color:var(--cmd)}
 .richlog .ln.err{color:#8d1f1f}
 .richlog .obj{margin:7px 0 10px 14px;padding:6px;border:1px solid #cdc7b4;border-radius:3px;
               background:var(--obj);display:inline-block;max-width:calc(100% - 28px);
               overflow:auto;vertical-align:top;box-shadow:0 1px 2px #00000014}
 .richlog .obj svg{display:block;max-width:100%;height:auto}
 .obj table.m, .richtext .obj table.m{border-collapse:collapse}
 .obj table.m td, .richtext .obj table.m td{border:1px solid #d3cebc;padding:2px 9px;font-size:12px}
 .obj table.m td:first-child{color:#4c4a3e;background:#f1ecdd;white-space:nowrap}
 .obj .note{color:#54513f;font-size:11px;max-width:580px;line-height:1.45}
 .obj h3{font-size:12px;margin:4px 0;color:#33387e}
 .mods{flex:1;overflow:auto;padding:7px 5px;font:13px/1.75 inherit}
 .mods .m{padding:1px 9px;cursor:pointer;border-radius:3px}
 .mods .m:hover{background:#e9e5d6;text-decoration:underline}
 .mods .m.rt{font-weight:700}
 .mods .hd{padding:3px 9px;color:#7a7666;font-size:11px;letter-spacing:.6px}
 .panelbody{flex:1;overflow:auto;padding:12px 14px}
 .panelbody .prow{display:flex;gap:9px;align-items:center;margin:7px 0;flex-wrap:wrap}
 .panelbody .plabel{color:#3b3930}
 .panelbody input{font:13px inherit;padding:4px 7px;border:1px solid var(--rule);border-radius:3px;background:#fff;width:92px}
 .panelbody button{font:13px inherit;border:1px solid var(--rule);border-radius:3px;background:var(--btn);cursor:pointer;padding:5px 13px}
 .panelbody button:hover{background:#fff;box-shadow:0 1px 2px #0002}
 .foot{font-size:11px;color:var(--dim);padding:3px 9px;border-top:1px solid #c4bfae;background:#efece1}
</style></head>
<body>
<header>
  <span><b>ORPHEUS</b> — the system is its texts: <b>middle-click</b> any command line to run it (or caret + Ctrl/⌘+Enter); objects embed where you run them; drag the bars to resize.</span>
  <span class="links">
    <a href="#" onclick="openTool('Trade');return false" title="trading tool text">Trade</a><a class="pg" href="/trade" title="full page">↗</a>
    <a href="#" onclick="openTool('Chart');return false" title="chart tool text">Charts</a><a class="pg" href="/chart">↗</a>
    <a href="#" onclick="openTool('Fin');return false" title="financial-ML tool text">Finance</a><a class="pg" href="/fin">↗</a>
    <a href="#" onclick="openTool('Plan');return false" title="economic-planning tool text">Plan</a><a class="pg" href="/plan">↗</a>
    <a href="#" onclick="openTool('Trace');return false" title="ray-tracer tool text">Trace</a>
    <a href="#" onclick="openTool('Derive');return false" title="Ligurian derivation tool text">Derive</a><a class="pg" href="/derive">↗</a>
    <a href="#" onclick="openTool('Gpu');return false" title="GPU tool text">GPU</a><a class="pg" href="/gpu">↗</a>
    <a href="#" onclick="openDocsTool();return false" title="documentation index">Docs</a><a class="pg" href="/docs">↗</a>
    <a href="/grammar" title="the Ligurian grammar (page)">Grammar</a>
    <a href="/chess" title="the chess board (page)">Chess</a>
    <a href="/editor" title="the WYSIWYG page editor">Editor</a>
  </span>
</header>

<div id="screen">
  <div class="track" id="userTrack"></div>
  <div class="tsep" id="trackSep"></div>
  <div class="track" id="sysTrack"></div>
</div>

<script>
"use strict";
/* ============================================================================
   The Oberon model, faithfully: the display is tracks of VIEWERS; a viewer is
   a title bar (name + a command menu) over a main frame; tools are TEXTS, and
   a text is a sequence of elements where an element is a character OR an
   embedded dynamic object (a chart, a drawing, a report) produced by running
   a command inside that very text. Texts store to files and load back with
   their objects rehydrated. Modules compile from frames straight into the
   running system; user packages persist to pkg/.
   ============================================================================ */

var viewers = [], marked = null, uid = 0;
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
function track(name){ return document.getElementById(name==='sys'?'sysTrack':'userTrack'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---- resizable layout ----------------------------------------------------- */
function dragSep(sep, prevEl, nextEl, horizontal){
  sep.addEventListener('mousedown', function(e){
    e.preventDefault();
    var p0 = horizontal ? prevEl.offsetWidth  : prevEl.offsetHeight;
    var n0 = horizontal ? nextEl.offsetWidth  : nextEl.offsetHeight;
    var start = horizontal ? e.clientX : e.clientY;
    var g0 = parseFloat(prevEl.style.flexGrow || getComputedStyle(prevEl).flexGrow || 1);
    var gn0 = parseFloat(nextEl.style.flexGrow || getComputedStyle(nextEl).flexGrow || 1);
    function move(ev){
      var d = (horizontal ? ev.clientX : ev.clientY) - start;
      var p = Math.max(48, p0 + d), n = Math.max(48, n0 - d);
      var total = g0 + gn0, px = p0 + n0;
      prevEl.style.flexGrow = (total * p / px).toFixed(4);
      nextEl.style.flexGrow = (total * n / px).toFixed(4);
    }
    function up(){ window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); }
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  });
}
function relayout(tr){
  Array.prototype.slice.call(tr.querySelectorAll(':scope > .vsep')).forEach(function(s){ s.remove(); });
  var kids = Array.prototype.slice.call(tr.children).filter(function(c){ return c.classList.contains('viewer'); });
  for(var i=1;i<kids.length;i++){
    var s = el('div','vsep');
    tr.insertBefore(s, kids[i]);
    dragSep(s, kids[i-1], kids[i], false);
  }
}

/* ---- viewers --------------------------------------------------------------- */
function makeViewer(opts){
  // kinds: 'text' (rich, editable, objects embed inline) · 'frame' (plain source)
  //        'log'/'out' (rich output streams) · 'mods' · 'panel'
  var v = {id:++uid, name:opts.name, kind:opts.kind, grown:false};
  var box = el('div','viewer'); v.box = box;
  var menu = el('div','menu');
  v.star = el('span','star',''); menu.appendChild(v.star);
  menu.appendChild(el('span','name', opts.name));
  (opts.menu||[]).forEach(function(c){
    var b = el('span','cmd', c.label||c.cmd); b.title=c.cmd;
    b.onmousedown=function(e){ if(e.button===0||e.button===1){ e.preventDefault(); mark(v); exec(c.cmd, v); } };
    menu.appendChild(b);
  });
  menu.appendChild(el('span','spacer'));
  menu.onmousedown=function(e){ if(e.target===menu||e.target.classList.contains('name')||e.target.classList.contains('star')) mark(v); };
  box.appendChild(menu);

  var body = el('div','body');
  if(opts.kind==='mods'){
    var md = el('div','mods'); v.mods = md; body.appendChild(md);
  } else if(opts.kind==='log'||opts.kind==='out'){
    var rl = el('div','richlog'); v.rich = rl; wireRichLog(rl, v); body.appendChild(rl);
  } else if(opts.kind==='panel'){
    var pb = el('div','panelbody'); v.panelbody = pb; body.appendChild(pb);
    if(opts.panel) renderPanel(v, opts.panel);
  } else if(opts.kind==='text'){
    var rt = el('div','richtext'); rt.contentEditable = 'true'; rt.spellcheck = false;
    v.rich = rt; wireRichText(rt, v);
    if(opts.content) setTextContent(v, opts.content);
    body.appendChild(rt);
  } else {
    var ta = el('textarea','frame'); ta.spellcheck=false; ta.value=opts.content||'';
    wireFrame(ta, v);
    body.appendChild(ta); v.textarea = ta;
  }
  box.appendChild(body);
  if(opts.foot) box.appendChild(el('div','foot', opts.foot));
  track(opts.track).appendChild(box);
  viewers.push(v);
  relayout(track(opts.track));
  return v;
}

/* plain source frames (modules, raw markdown) */
function wireFrame(ta, v){
  ta.addEventListener('mousedown', function(e){ mark(v); if(e.button===1) e.preventDefault(); });
  ta.addEventListener('auxclick', function(e){
    if(e.button===1){ e.preventDefault(); execText(v, lineAtPoint(ta, e.clientY)); }
  });
  ta.addEventListener('keydown', function(e){
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){
      e.preventDefault();
      var s = ta.value.substring(ta.selectionStart, ta.selectionEnd).trim();
      execText(v, s || caretLine(ta));
    }
  });
}
function lineAtPoint(ta, y){
  var cs=getComputedStyle(ta), lh=parseFloat(cs.lineHeight)||20, pt=parseFloat(cs.paddingTop)||0;
  var rel = y - ta.getBoundingClientRect().top - pt + ta.scrollTop;
  var idx = Math.floor(rel/lh), lines = ta.value.split('\n');
  return (idx>=0 && idx<lines.length) ? lines[idx] : '';
}
function caretLine(ta){
  var s=ta.value, p=ta.selectionStart;
  var a=s.lastIndexOf('\n',p-1)+1, b=s.indexOf('\n',p); if(b<0)b=s.length;
  return s.slice(a,b);
}
function execText(v, lineText){
  var t=(lineText||'').trim();
  if(!t || t.charAt(0)==='#' || t.slice(0,2)==='::') return;
  mark(v); exec(t, v);
}

/* ---- TEXT frames: editable texts with embedded dynamic objects ------------ */
/* Middle-click a line: it runs as a command, and if it produces an object
   (a chart, drawing, table, render…), the object is inserted INTO THE TEXT
   right under that line — Oberon's "text as a sequence of characters and
   active elements". Objects remember their command (data-cmd), so the text
   serializes to markdown (```tool <cmd>``` fences) and rehydrates on load. */
function wireRichText(rt, v){
  rt.addEventListener('mousedown', function(e){ mark(v); if(e.button===1) e.preventDefault(); });
  rt.addEventListener('auxclick', function(e){
    if(e.button!==1) return;
    e.preventDefault();
    var node = lineNodeAt(rt, e.target);
    if(node) runTextLine(v, node);
  });
  rt.addEventListener('keydown', function(e){
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){
      e.preventDefault();
      var sel = window.getSelection();
      var node = sel && sel.anchorNode ? lineNodeAt(rt, sel.anchorNode) : null;
      if(node) runTextLine(v, node);
    }
  });
  // objects are atomic: a click selects, backspace/delete removes whole object
  rt.addEventListener('keydown', function(e){
    if((e.key==='Backspace'||e.key==='Delete')){
      var sel=window.getSelection();
      if(sel && sel.anchorNode){
        var o = closestObj(rt, sel.anchorNode);
        if(o){ e.preventDefault(); o.remove(); }
      }
    }
  });
}
function closestObj(rt, n){
  while(n && n!==rt){ if(n.classList && n.classList.contains('obj')) return n; n=n.parentNode; }
  return null;
}
function lineNodeAt(rt, n){
  // the nearest block-level child of the richtext that contains n
  if(n.nodeType===3) n=n.parentNode;
  var o = closestObj(rt, n);
  if(o) return o; // middle-click an object: re-run its command in place
  while(n && n!==rt && n.parentNode!==rt) n=n.parentNode;
  return (n===rt) ? null : n;
}
function runTextLine(v, node){
  var cmd = node.classList && node.classList.contains('obj')
    ? (node.dataset.cmd||'')
    : (node.textContent||'').trim();
  cmd = cmd.replace(/^[\u25B8! ] ?/,'');
  if(!cmd || cmd.charAt(0)==='#' || cmd.slice(0,2)==='::') return;
  mark(v);
  exec(cmd, v, {textViewer:v, afterNode:node});
}
/* insert (or replace) an object under `afterNode` in a text frame */
function insertObjAt(v, afterNode, cmd, html){
  var d = el('div','obj');
  d.contentEditable='false';
  d.dataset.cmd = cmd;
  d.innerHTML = html;
  // replace an existing object produced by the same line (re-run updates it)
  var nxt = afterNode.nextSibling;
  if(afterNode.classList && afterNode.classList.contains('obj')){
    afterNode.replaceWith(d); return;
  }
  if(nxt && nxt.classList && nxt.classList.contains('obj') && nxt.dataset.cmd===cmd){
    nxt.replaceWith(d); return;
  }
  afterNode.after(d);
}
/* serialize a text frame to markdown: objects become ```tool <cmd>``` fences */
function textToMarkdown(v){
  var out=[];
  v.rich.childNodes.forEach(function(n){
    if(n.nodeType===3){ var t=n.textContent; if(t.trim()!=='') out.push(t); return; }
    if(n.classList && n.classList.contains('obj')){
      out.push('```tool '+(n.dataset.cmd||'')+'\n```');
      return;
    }
    out.push(n.textContent||'');
  });
  return out.join('\n')+'\n';
}
/* load markdown into a text frame, REHYDRATING ```tool fences by re-running */
function setTextContent(v, md){
  v.rich.innerHTML='';
  var lines = md.replace(/\n$/,'').split('\n');
  var i=0;
  while(i<lines.length){
    var m = lines[i].match(/^```tool (.+)$/);
    if(m){
      var cmd=m[1].trim();
      var line=el('div',null,'');
      var ph=el('div','obj'); ph.contentEditable='false'; ph.dataset.cmd=cmd; ph.textContent='… rehydrating: '+cmd;
      v.rich.appendChild(ph);
      while(i<lines.length && lines[i].trim()!=='```') i++;
      i++;
      (function(ph,cmd){ runObjectCommand(cmd, function(html, isText, isErr){
        if(isText) ph.innerHTML='<span class="note">'+esc(html)+'</span>';
        else ph.innerHTML=html;
      }); })(ph,cmd);
      void line;
      continue;
    }
    v.rich.appendChild(el('div',null,lines[i]===''?'\u200b':lines[i]));
    i++;
  }
}

/* ---- the rich Log / tool-output streams ----------------------------------- */
function wireRichLog(rl, v){
  rl.addEventListener('mousedown', function(e){ mark(v); if(e.button===1) e.preventDefault(); });
  rl.addEventListener('auxclick', function(e){
    if(e.button!==1) return;
    var ln = e.target.closest ? e.target.closest('.ln') : null;
    if(ln){ e.preventDefault(); execText(v, ln.textContent.replace(/^[\u25B8! ] ?/,'')); }
  });
}
function logView(){ return viewers.find(function(v){return v.kind==='log';}); }
function logLine(s, cls){
  var rl=logView().rich;
  var d=el('div','ln'+(cls?' '+cls:''), s);
  rl.appendChild(d); rl.scrollTop=rl.scrollHeight;
}
function appendLog(s){ String(s).replace(/\n$/,'').split('\n').forEach(function(l){ logLine(l); }); }
function logEcho(s){ logLine('\u25B8 '+s, 'echo'); }
function logOut(s, isErr){
  String(s).replace(/\n+$/,'').split('\n').forEach(function(l){ logLine((isErr?'! ':'  ')+l, isErr?'err':null); });
  logLine('');
}
function logObj(html){
  var rl=logView().rich;
  var d=el('div','obj'); d.innerHTML=html;
  rl.appendChild(d); rl.appendChild(el('div','ln',''));
  rl.scrollTop=rl.scrollHeight;
}
function clearLog(){ logView().rich.innerHTML=''; }

function mark(v){
  marked=v;
  viewers.forEach(function(x){ x.box.classList.toggle('marked', x===v); x.star.textContent=(x===v?'\u2737':''); });
}

/* ---- panels ---------------------------------------------------------------- */
function renderPanel(v, p){
  var pb=v.panelbody; pb.innerHTML='';
  var fields={};
  function build(item, into){
    if(item.t==='row'){
      var r=el('div','prow'); (item.items||[]).forEach(function(it){ build(it, r); }); into.appendChild(r); return;
    }
    if(item.t==='label'){ into.appendChild(el('span','plabel', item.text.replace(/-/g,' '))); return; }
    if(item.t==='field'){
      var inp=document.createElement('input'); inp.value=item.init||''; fields[item.name]=inp;
      into.appendChild(inp); return;
    }
    if(item.t==='button'){
      var b=document.createElement('button'); b.textContent=item.text;
      b.onclick=function(){
        var cmd=item.cmd.replace(/\$([A-Za-z0-9_]+)/g, function(_,n){ return fields[n]?fields[n].value.trim():''; });
        mark(v); exec(cmd, v);
      };
      into.appendChild(b); return;
    }
  }
  (p.items||[]).forEach(function(it){ build(it, pb); });
}
function openPanel(spec){
  post('/api/ui', spec, function(out){
    try{
      var p=JSON.parse(out);
      if(p.error){ logOut('ui: '+p.error, true); return; }
      mark(makeViewer({name:(p.title||'Panel'), track:'user', kind:'panel', panel:p, menu:toolMenu,
        foot:'a graphical front end described in Latte (lib/ui.lat) — buttons call module arms'}));
    } catch(e){ logOut('ui: '+out, true); }
  });
}

/* ---- per-tool OUTPUT viewers ------------------------------------------------ */
function outViewer(name){
  var v = viewers.find(function(x){ return x.kind==='out' && x.name===name; });
  if(!v){
    v = makeViewer({name:name, track:'user', kind:'out', menu:outMenu,
      foot:'tool output — re-run from any command line; several tools can run at once'});
  }
  return v;
}
var runSeq = 0;
function runInto(name, line, fire){
  logEcho(line);
  var v = outViewer(name); mark(v);
  var seq = ++runSeq;
  v.busySeq = seq;
  v.rich.innerHTML = '';
  var hdr = el('div','ln echo', '\u25B8 '+line);
  var run = el('div','ln', '  … running ('+new Date().toLocaleTimeString()+')');
  v.rich.appendChild(hdr); v.rich.appendChild(run);
  fire(function(html, isText, isErr){
    if(v.busySeq!==seq) return;
    run.remove();
    if(isText){
      String(html).replace(/\n+$/,'').split('\n').forEach(function(l){
        v.rich.appendChild(el('div','ln'+(isErr?' err':''),(isErr?'! ':'  ')+l));
      });
    } else {
      var d=el('div','obj'); d.innerHTML=html; v.rich.appendChild(d);
    }
    v.rich.scrollTop=0;
  });
}

/* ---- documents as frames ---------------------------------------------------- */
function openDoc(name){
  fetch('/api/doc?name='+encodeURIComponent(name)).then(function(r){return r.text();}).then(function(md){
    var v = makeViewer({name:name+'.md', track:'user', kind:'frame', content:md, menu:docMenu,
      foot:'editing docs/'+name+'.md — Edit.Save writes it back; open as many documents as you like'});
    v.docname = name;
    mark(v);
  });
}
function saveDoc(v){
  if(!v||!v.docname||!v.textarea){ logOut('Edit.Save: mark a document frame first', true); return; }
  fetch('/api/doc?name='+encodeURIComponent(v.docname),{method:'POST',body:v.textarea.value})
    .then(function(r){return r.text();})
    .then(function(msg){ logOut(msg==='saved' ? 'saved docs/'+v.docname+'.md' : msg, msg!=='saved'); });
}

/* ---- TEXTS: create, store, load (the documents-with-objects) ---------------- */
function newText(name){
  var v = makeViewer({name:(name||'untitled')+'.Text', track:'user', kind:'text',
    content:'A new text. Type anything; middle-click a command line to run it —\nobject-producing commands embed their result right here in the text.\n\nchart bar 3 1 4 1 5 9 2 6\ngfx Tool.rings 5\n',
    menu:textMenu,
    foot:'a TEXT — characters and embedded objects; Store saves it (with its objects) to text/'+(name||'untitled')+'.md'});
  v.textname = name||'untitled';
  mark(v);
}
function storeText(v){
  if(!v||v.kind!=='text'){ logOut('Edit.StoreText: mark a text frame first', true); return; }
  var name = v.textname || v.name.replace(/\.Text$/,'') || 'untitled';
  fetch('/api/text?name='+encodeURIComponent(name),{method:'POST',body:textToMarkdown(v)})
    .then(function(r){return r.text();})
    .then(function(msg){ logOut(msg==='saved' ? 'stored text/'+name+'.md (objects serialized as ```tool fences)' : msg, msg!=='saved'); });
}
function openText(name){
  fetch('/api/text?name='+encodeURIComponent(name))
    .then(function(r){ if(!r.ok) throw new Error('no such text'); return r.text(); })
    .then(function(md){
      var v = makeViewer({name:name+'.Text', track:'user', kind:'text', content:md, menu:textMenu,
        foot:'text/'+name+'.md — objects rehydrated by re-running their commands; Store writes it back'});
      v.textname = name;
      mark(v);
    })
    .catch(function(e){ logOut('System.OpenText: '+e, true); });
}
function listTexts(){
  fetch('/api/texts').then(function(r){return r.text();}).then(function(t){
    var names=t.split('\n').filter(Boolean);
    logOut(names.length ? ('texts on disk: '+names.join('  ')+'\nopen one:  System.OpenText <name>') : 'no stored texts yet — System.NewText <name>, then Store');
  });
}

/* ---- OBJECT-PRODUCING commands: one router used by Log, out-viewers, texts -- */
function runObjectCommand(line, done){
  var sp=line.indexOf(' ');
  var head = sp<0?line:line.slice(0,sp);
  var rest = sp<0?'':line.slice(sp+1).trim();
  function svgOr(done){ return function(svg){ if(/^\s*<svg/.test(svg)) done(svg,false); else done(svg,true,true); }; }
  switch(head){
    case 'gfx': case 'draw':
      post('/api/gfx', rest, svgOr(done)); return true;
    case 'trace': case 'render':
      post('/api/trace', rest.split(/\s+/).filter(Boolean).join('\n'), svgOr(done)); return true;
    case 'chart': case 'plot':
      if(/^market\b/.test(rest)){
        post('/api/marketchart', rest.replace(/^market\s*/,'').split(/\s+/).filter(Boolean).join('\n'), svgOr(done));
      } else {
        post('/api/plot', rest, svgOr(done));
      }
      return true;
    case 'ta': case 'indicators':
      post('/api/ta', rest.split(/\s+/).filter(Boolean).join('\n'), function(h){ done(h,false); }); return true;
    case 'trade': case 'advise':
      post('/api/trade', rest.split(/\s+/).filter(Boolean).join('\n'), function(h){ done(h,false); }); return true;
    case 'fin':
      post('/api/fin', rest, function(h){ done(h,false); }); return true;
    case 'gpu':
      post('/api/gpu', rest, function(h){ done(h,false); }); return true;
    case 'plan':
      post('/api/plan', rest||'demo3', function(out){
        done('<pre style="margin:0;font:12px/1.5 inherit;white-space:pre-wrap">'+esc(out)+'</pre>', false);
      });
      return true;
    case 'derive': {
      var parts = rest.split(/\s+/).filter(Boolean);
      var mode = parts[0]||'solar';
      var body = 'mode='+mode+'\n'+parts.slice(1).map(function(w){
        return /^(n|seed)=/.test(w) ? w : w;
      }).join('\n');
      post('/api/derive', body, function(out){
        try{
          var j=JSON.parse(out);
          var withPie = mode==='pie';
          var h='<table class="m"><tr>'+(withPie?'<td><b>PIE</b></td>':'')+'<td><b>Solar</b></td><td><b>Heart</b></td></tr>';
          j.rows.forEach(function(r){
            h+='<tr>'+(withPie?('<td><i>*'+esc(r.pie)+'</i></td>'):'')+'<td><b>'+esc(r.solar)+'</b></td><td>'+esc(r.heart)+'</td></tr>';
          });
          done(h+'</table>', false);
        } catch(e){ done(out, true, true); }
      });
      return true;
    }
    default: return false; // not an object command
  }
}

/* ---- the command interpreter -------------------------------------------- */
function resolveArgs(line){
  var sel=(window.getSelection && String(window.getSelection()))||'';
  return line.replace(/\^/g, function(){ return sel.trim(); });
}
function exec(line, fromViewer, ctx){
  if(!line) return; line=line.trim();
  var sp=line.indexOf(' ');
  var headTok = sp<0?line:line.slice(0,sp);
  var rest = sp<0?'':line.slice(sp+1).trim();

  // ---- System.* ----
  if(headTok==='System.Open'||headTok==='Edit.Open'){ logEcho(line); openModule(rest||'std'); return; }
  if(headTok==='System.Close'){ logEcho(line); closeViewer(targetViewer(rest, fromViewer)); return; }
  if(headTok==='System.Grow'){ logEcho(line); growViewer(targetViewer(rest, fromViewer)); return; }
  if(headTok==='System.Copy'){ logEcho(line); copyViewer(targetViewer(rest, fromViewer)); return; }
  if(headTok==='System.Clear'){ clearLog(); return; }
  if(headTok==='System.Modules'||headTok==='System.Sources'){ logEcho(line); refreshModules(); return; }
  if(headTok==='System.New'){ logEcho(line); newModuleViewer(rest||'mymod'); return; }
  if(headTok==='System.NewText'){ logEcho(line); newText(rest||'untitled'); return; }
  if(headTok==='System.OpenText'){ logEcho(line); if(rest) openText(rest); else listTexts(); return; }
  if(headTok==='System.Texts'){ logEcho(line); listTexts(); return; }
  if(headTok==='Edit.StoreText'){ logEcho(line); storeText(targetViewer(rest, fromViewer)); return; }
  if(headTok==='System.Tool'){ logEcho(line); openTool(rest||'Trade'); return; }
  if(headTok==='System.Chess'||headTok==='Game.Chess'){ logEcho(line); window.location='/chess'; return; }
  if(headTok==='System.Docs'||headTok==='System.Help'){ logEcho(line); openDocsTool(); return; }
  if(headTok==='System.Edit'||headTok==='Edit.Doc'){ logEcho(line); if(rest) openDoc(rest); else logOut('System.Edit: name a doc, e.g.  System.Edit latte-language', true); return; }
  if(headTok==='Edit.Save'){ logEcho(line); saveDoc(targetViewer(rest, fromViewer)); return; }
  if(headTok==='Edit.Format'){ logEcho(line); formatFrame(targetViewer(rest, fromViewer)); return; }
  if(headTok==='System.Sentiment'||headTok==='News.Score'){
    logEcho(line);
    if(!rest){ logOut('System.Sentiment: type some headline text after the command', true); return; }
    post('/api/sentiment', rest, function(out){
      try {
        var j=JSON.parse(out);
        logOut('sentiment: '+(j.polarity>=0?'+':'')+j.polarity+'   [trained model '+(j.model>=0?'+':'')+j.model+' · lexicon '+(j.lexicon>=0?'+':'')+j.lexicon+']');
      }
      catch(e){ logOut(out, true); }
    });
    return;
  }
  if(headTok==='Doc.Score'||headTok==='Report.Score'){
    if(!rest){ logEcho(line); logOut('Doc.Score: name a doc, e.g.  Doc.Score visualization-and-ml', true); return; }
    runInto('Score.Out', line, function(done){
      fetch('/api/doc?name='+encodeURIComponent(rest.replace(/\.md$/,'')))
        .then(function(r){ if(!r.ok) throw new Error('no such doc'); return r.text(); })
        .then(function(md){ return fetch('/api/sentiment',{method:'POST',headers:{'Content-Type':'text/plain; charset=utf-8'},body:md}); })
        .then(function(r){ return r.json(); })
        .then(function(j){
          var lbl = j.polarity>0.15?'POSITIVE':(j.polarity<-0.15?'NEGATIVE':'neutral');
          var h='<h3>docs/'+rest+'.md — document score '+(j.polarity>=0?'+':'')+j.polarity+' ('+lbl+')</h3>'+
                '<p class="note">trained classifier, sentence-level; confidence-weighted aggregate over '+j.sentences.length+' sentences. Strongest evidence:</p>'+
                '<table class="m"><tr><td><b>score</b></td><td><b>sentence</b></td></tr>';
          var ranked=j.sentences.slice().sort(function(a,b){return Math.abs(b.polarity)-Math.abs(a.polarity);}).slice(0,10);
          ranked.forEach(function(sx){
            var c = sx.polarity>0.15?'#1a6e2a':(sx.polarity<-0.15?'#8d1f1f':'#555');
            h+='<tr><td style="color:'+c+'">'+(sx.polarity>=0?'+':'')+sx.polarity+'</td><td>'+esc(sx.text).slice(0,140)+'</td></tr>';
          });
          h+='</table>';
          done(h,false);
        })
        .catch(function(e){ done('Doc.Score: '+e,true,true); });
    });
    return;
  }

  // ---- object-producing commands -------------------------------------------
  // Inside a TEXT frame they embed where you ran them; otherwise each tool
  // fills its own output viewer (several can run at once).
  var sink = ctx && ctx.textViewer ? ctx : null;
  var OUT = {gfx:'Gfx.Out',draw:'Gfx.Out',trace:'Trace.Out',render:'Trace.Out',
             chart:'Chart.Out',plot:'Chart.Out',ta:'TA.Out',indicators:'TA.Out',
             trade:'Trade.Out',advise:'Trade.Out',fin:'Fin.Out',gpu:'Gpu.Out',
             derive:'Derive.Out',plan:'Plan.Out'};
  if(OUT[headTok]){
    if(sink){
      logEcho(line);
      var ph = sink.afterNode;
      runObjectCommand(line, function(html, isText, isErr){
        if(isErr){ logOut(html, true); return; }
        insertObjAt(sink.textViewer, ph, line, isText?('<span class="note">'+esc(html)+'</span>'):html);
      });
    } else {
      runInto(OUT[headTok], line, function(done){ runObjectCommand(line, done); });
    }
    return;
  }
  // net runs in its own viewer (textual, audited)
  if(headTok==='net'){
    runInto('Net.Out', line, function(done){
      post('/api/run', resolveArgs(line), function(out){ done(out,true,/^!|error/i.test(out)); });
    });
    return;
  }
  if(headTok==='ui'||headTok==='panel'){
    logEcho(line);
    if(!rest){ logOut('ui: name a panel arm, e.g.  ui Tool.calc', true); return; }
    openPanel(rest);
    return;
  }

  // ---- Compiler.* ----
  if(headTok==='Compiler.Compile'){
    logEcho(line);
    var cv=targetViewer(rest, fromViewer);
    if(!cv||!cv.textarea){ logOut('Compiler.Compile: mark a source frame first',true); return; }
    post('/api/compile', cv.textarea.value, function(out){ logOut(out, /error/i.test(out)); refreshModules(); });
    return;
  }
  if(headTok==='Compiler.Store'||headTok==='Edit.Store'){
    logEcho(line);
    var sv=targetViewer(rest, fromViewer);
    if(!sv||!sv.textarea){ logOut('Store: mark a source frame first',true); return; }
    post('/api/source', sv.textarea.value, function(out){ logOut(out, /error/i.test(out)); refreshModules(); });
    return;
  }

  // ---- everything else -> the running system ----
  logEcho(line);
  post('/api/run', resolveArgs(line), function(out){ logOut(out, /^!|error/i.test(out)); });
}

function formatFrame(v){
  if(!v||!v.textarea){ logOut('Edit.Format: mark a source frame first', true); return; }
  post('/api/fmt', v.textarea.value, function(out){
    if(out && out !== v.textarea.value){ v.textarea.value = out; logOut('formatted (conservative; compile-checked)'); }
    else logOut('already formatted');
  });
}

function targetViewer(rest, fromViewer){
  rest=(rest||'').trim();
  if(rest===''||rest==='*') return marked||fromViewer;
  var nm=rest.replace(/\.Mod$/,'');
  return viewers.find(function(v){ return v.name===rest||v.name===nm||v.name===nm+'.Mod'||v.name===nm+'.Text'; })||marked||fromViewer;
}

/* ---- viewer operations --------------------------------------------------- */
function closeViewer(v){
  if(!v||v.kind==='log') return;
  var tr=v.box.parentElement;
  v.box.remove(); viewers=viewers.filter(function(x){return x!==v;});
  if(marked===v) marked=null;
  if(tr) relayout(tr);
}
function growViewer(v){ if(!v) return; v.grown=!v.grown; v.box.classList.toggle('grown', v.grown); v.box.style.flexGrow=''; }
function copyViewer(v){
  if(!v) return;
  if(v.textarea){ mark(makeViewer({name:v.name, track:'user', kind:'frame', content:v.textarea.value, menu:sourceMenu})); return; }
  if(v.kind==='text'){ var n=makeViewer({name:v.name, track:'user', kind:'text', content:textToMarkdown(v), menu:textMenu}); n.textname=v.textname; mark(n); }
}

/* ---- modules ---------------------------------------------------------------- */
function openModule(name){
  fetch('/api/source?name='+encodeURIComponent(name)).then(function(r){return r.text();}).then(function(src){
    mark(makeViewer({name:name+'.Mod', track:'user', kind:'frame', content:src, menu:sourceMenu,
      foot:'module `'+name+'` — Compile loads it into the running system; Store persists it (system libs to lib/, your packages to pkg/)'}));
  });
}
function newModuleViewer(name){
  var src='import std\ncore '+name+'\n  greet = fn [_] -> %hello\nend\n';
  mark(makeViewer({name:name+'.Mod', track:'user', kind:'frame', content:src, menu:sourceMenu,
    foot:'a new module — Compile, then Store writes pkg/'+name+'.lat (a user package, loaded at every startup)'}));
}
function refreshModules(){
  Promise.all([
    fetch('/api/sources').then(function(r){return r.text();}),
    fetch('/api/run',{method:'POST',headers:{'Content-Type':'text/plain'},body:'libs'}).then(function(r){return r.text();})
  ]).then(function(res){
    var names=res[0].split('\n').filter(Boolean);
    var rt=(res[1].match(/compiled:\s*(.*)/)||[])[1]||'';
    var rtset={}; rt.split(/\s+/).filter(Boolean).forEach(function(n){rtset[n]=1;});
    var md=viewers.find(function(v){return v.kind==='mods';}).mods; md.innerHTML='';
    md.appendChild(el('div','hd','MODULES — click to open source'));
    names.forEach(function(n){
      var d=el('div','m'+(rtset[n]?' rt':''), n+(rtset[n]?'  \u00B7live':''));
      d.onmousedown=function(e){ if(e.button===0||e.button===1){ e.preventDefault(); openModule(n); } };
      md.appendChild(d);
    });
  });
}

function post(url, body, cb){
  fetch(url,{method:'POST',headers:{'Content-Type':'text/plain; charset=utf-8'},body:body})
    .then(function(r){return r.text();}).then(cb).catch(function(e){ cb('network error: '+e); });
}

    foot:'the system tool TEXT — run lines in place; objects embed; Store keeps it'});
  st.textname='system-tool';
  var h=makeViewer({name:'hello.Mod', track:'user', kind:'frame', content:HELLO_MOD, menu:sourceMenu,
    foot:'module `hello` — Compile loads it into the running system; Store writes pkg/hello.lat'});
  makeViewer({name:'System.Log', track:'sys', kind:'log', menu:logMenu,
    foot:'the command trail — middle-click a line to run it again'});
  makeViewer({name:'Modules', track:'sys', kind:'mods', menu:modsMenu});
  dragSep(document.getElementById('trackSep'), track('user'), track('sys'), true);
  mark(h);
  refreshModules();
  appendLog('Orpheus System ready. Middle-click command lines; outputs embed in texts; drag bars to resize.');
  logLine('');
});
</script>
