<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orpheus · System</title>
<style>
 :root{
   --bg:#cfcab9; --ink:#1a1a2e; --paper:#f4f1e8; --title:#c9c4b4; --titlemark:#aeb0d8;
   --btn:#e8e4d8; --accent:#2a2d6e; --rule:#1a1a2e; --dim:#5b5848; --cmd:#1a2e6e;
   --lh:20px;
 }
 *{box-sizing:border-box}
 html,body{height:100%}
 body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;background:var(--bg);color:var(--ink);font-size:13px}
 header{background:var(--ink);color:var(--paper);padding:6px 12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.3px}
 header b{font-weight:600}
 header .links a{color:#bcd;text-decoration:none;margin-left:12px}
 header .links a:hover{text-decoration:underline}
 #screen{display:flex;height:calc(100vh - 34px);padding:4px}
 .track{display:flex;flex-direction:column;min-width:120px;height:100%}
 #userTrack{flex:62 1 0}
 #sysTrack{flex:38 1 0}
 /* draggable separators: between tracks (col) and between viewers (row) */
 .tsep{flex:0 0 6px;cursor:col-resize;position:relative}
 .tsep::after{content:'';position:absolute;left:2px;top:0;bottom:0;width:2px;background:#b7b2a2}
 .tsep:hover::after{background:var(--accent)}
 .vsep{flex:0 0 6px;cursor:row-resize;position:relative}
 .vsep::after{content:'';position:absolute;top:2px;left:0;right:0;height:2px;background:#b7b2a2}
 .vsep:hover::after{background:var(--accent)}
 .viewer{display:flex;flex-direction:column;min-height:64px;background:var(--paper);border:1.5px solid var(--rule);flex:1 1 0;overflow:hidden}
 .viewer.grown{flex:8 1 0}
 .menu{display:flex;align-items:center;background:var(--title);border-bottom:1.5px solid var(--rule);
       padding:2px 6px;font-size:12px;cursor:default;user-select:none;flex-wrap:wrap}
 .viewer.marked .menu{background:var(--titlemark)}
 .menu .name{font-weight:700;margin-right:10px;white-space:nowrap}
 .menu .star{margin-right:6px;width:12px;display:inline-block;text-align:center;color:var(--accent)}
 .menu .cmd{color:var(--cmd);cursor:pointer;padding:0 6px;border-left:1px solid #b7b2a2}
 .menu .cmd:first-of-type{border-left:0}
 .menu .cmd:hover{background:#fff;text-decoration:underline}
 .menu .spacer{flex:1}
 .body{flex:1;min-height:0;display:flex}
 /* A text frame: editable text that is also executable (the Oberon TUI). */
 textarea.frame{flex:1;width:100%;border:0;margin:0;padding:6px 8px;resize:none;outline:none;
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:var(--lh);
       background:var(--paper);color:var(--ink);white-space:pre;overflow:auto}
 /* The rich Log: text lines (each executable) interleaved with embedded OBJECTS
    (SVG drawings, charts, HTML reports) — the Oberon "texts with embedded
    gadgets" idea. */
 .richlog{flex:1;overflow:auto;padding:6px 8px;background:#fbfbf6;line-height:var(--lh)}
 .richlog .ln{white-space:pre-wrap;min-height:var(--lh);cursor:default}
 .richlog .ln:hover{background:#f0eddc}
 .richlog .ln.echo{color:var(--cmd)}
 .richlog .ln.err{color:#7a1a1a}
 .richlog .obj{margin:6px 0 10px 12px;padding:4px;border:1px solid #c8c2b0;background:#fff;
               display:inline-block;max-width:calc(100% - 24px);overflow:auto;vertical-align:top}
 .richlog .obj svg{display:block;max-width:100%;height:auto}
 .richlog .obj table.m{border-collapse:collapse}
 .richlog .obj table.m td{border:1px solid #c9c4b4;padding:2px 8px;font-size:12px}
 .richlog .obj table.m td:first-child{color:#444;background:#efeadd;white-space:nowrap}
 .richlog .obj .note{color:#444;font-size:11px;max-width:560px;line-height:1.4}
 .richlog .obj h3{font-size:12px;margin:4px 0}
 .mods{flex:1;overflow:auto;padding:6px 4px;font:13px/1.7 ui-monospace,monospace}
 .mods .m{padding:1px 8px;cursor:pointer;border-radius:2px}
 .mods .m:hover{background:#e7e3d6;text-decoration:underline}
 .mods .m.rt{font-weight:700}
 /* A PANEL viewer: a graphical front end described in Latte (lib/ui.lat). */
 .panelbody{flex:1;overflow:auto;padding:10px 12px}
 .panelbody .prow{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
 .panelbody .plabel{color:#333}
 .panelbody input{font:13px ui-monospace,monospace;padding:3px 6px;border:1px solid var(--rule);background:#fff;width:90px}
 .panelbody button{font:13px ui-monospace,monospace;border:1px solid var(--rule);background:var(--btn);cursor:pointer;padding:4px 12px}
 .panelbody button:hover{background:#fff}
 .foot{font-size:11px;color:var(--dim);padding:2px 8px;border-top:1px solid #bdb8a8;background:#efece1}
</style></head>
<body>
<header>
  <span><b>Orpheus · System</b> &nbsp;—&nbsp; tiled, <b>resizable</b> text frames. <b>Execute</b> a command with <b>middle-click</b> on its line, or caret-on-line + <b>Ctrl/⌘+Enter</b>; drag the bars between frames to resize. Every frame is editable.</span>
  <span class="links">
    <a href="/docs">Docs</a>
    <a href="/grammar">Grammar</a>
    <a href="/derive">Derive</a>
    <a href="/chess">Chess</a>
    <a href="#" onclick="openModule('tool');return false">open tool</a>
    <a href="/editor">Editor</a><a href="/chart">Charts</a><a href="/fin">Finance</a><a href="/trade">Trade</a><a href="/gpu">GPU</a><a href="/plan">Planner</a>
  </span>
</header>

<div id="screen">
  <div class="track" id="userTrack"></div>
  <div class="tsep" id="trackSep"></div>
  <div class="track" id="sysTrack"></div>
</div>

<script>
"use strict";
/* ============================================================================
   Oberon-style environment: tiled VIEWERS in two resizable TRACKS, each viewer
   a TEXT FRAME (an editable text that is also the command interface), a rich
   LOG that embeds dynamic objects (drawings, charts, reports) between its
   executable text lines, and PANEL viewers — graphical front ends described in
   Latte (lib/ui.lat) and connected straight to module arms.

   Point the mouse at any `Module.cmd args` line and middle-click to execute
   it; or put the caret on it and press Ctrl/Cmd+Enter; or select command text
   and run that. Drag the separator bars to resize frames and tracks.

   System.*  viewer/OS commands run in the browser (the display layer).
   Compiler.* posts source to the running system (/api/compile, /api/source).
   gfx/chart/ta/trade/ui render EMBEDDED OBJECTS (SVG or HTML) into the Log or
   open live panels. Everything else -> /api/run, calling a Latte arm: the
   command set of the system is Latte source you can open, edit and recompile
   right here.
   ============================================================================ */

var viewers = [], marked = null, uid = 0;
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
function track(name){ return document.getElementById(name==='sys'?'sysTrack':'userTrack'); }

/* ---- resizable layout ----------------------------------------------------- */
/* Each viewer is a flex child; a drag on the separator before it trades
   flex-grow with the previous viewer, pixel-for-pixel. The track separator
   does the same horizontally between the two tracks. */
function dragSep(sep, prevEl, nextEl, horizontal){
  sep.addEventListener('mousedown', function(e){
    e.preventDefault();
    var p0 = horizontal ? prevEl.offsetWidth  : prevEl.offsetHeight;
    var n0 = horizontal ? nextEl.offsetWidth  : nextEl.offsetHeight;
    var start = horizontal ? e.clientX : e.clientY;
    var g0 = parseFloat(prevEl.style.flexGrow || getComputedStyle(prevEl).flexGrow || 1);
    var gn0 = parseFloat(nextEl.style.flexGrow || getComputedStyle(nextEl).flexGrow || 1);
    function move(ev){
      var d = (horizontal ? ev.clientX : ev.clientY) - start;
      var p = Math.max(48, p0 + d), n = Math.max(48, n0 - d);
      var total = g0 + gn0, px = p0 + n0;
      prevEl.style.flexGrow = (total * p / px).toFixed(4);
      nextEl.style.flexGrow = (total * n / px).toFixed(4);
    }
    function up(){ window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); }
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  });
}
/* (re)build the viewer separators of a track after any add/remove */
function relayout(tr){
  Array.prototype.slice.call(tr.querySelectorAll(':scope > .vsep')).forEach(function(s){ s.remove(); });
  var kids = Array.prototype.slice.call(tr.children).filter(function(c){ return c.classList.contains('viewer'); });
  for(var i=1;i<kids.length;i++){
    var s = el('div','vsep');
    tr.insertBefore(s, kids[i]);
    dragSep(s, kids[i-1], kids[i], false);
  }
}

/* ---- a Viewer (a text frame, the rich log, the module list, or a panel) --- */
function makeViewer(opts){
  // opts: {name, track, kind:'frame'|'log'|'mods'|'panel', menu, content, foot, panel}
  var v = {id:++uid, name:opts.name, kind:opts.kind, grown:false};
  var box = el('div','viewer'); v.box = box;
  var menu = el('div','menu');
  v.star = el('span','star',''); menu.appendChild(v.star);
  menu.appendChild(el('span','name', opts.name));
  (opts.menu||[]).forEach(function(c){
    var b = el('span','cmd', c.label||c.cmd); b.title=c.cmd;
    b.onmousedown=function(e){ if(e.button===0||e.button===1){ e.preventDefault(); mark(v); exec(c.cmd, v); } };
    menu.appendChild(b);
  });
  menu.appendChild(el('span','spacer'));
  menu.onmousedown=function(e){ if(e.target===menu||e.target.classList.contains('name')||e.target.classList.contains('star')) mark(v); };
  box.appendChild(menu);

  var body = el('div','body');
  if(opts.kind==='mods'){
    var md = el('div','mods'); v.mods = md; body.appendChild(md);
  } else if(opts.kind==='log'){
    var rl = el('div','richlog'); v.rich = rl; wireRichLog(rl, v); body.appendChild(rl);
  } else if(opts.kind==='panel'){
    var pb = el('div','panelbody'); v.panelbody = pb; body.appendChild(pb);
    if(opts.panel) renderPanel(v, opts.panel);
  } else {
    var ta = el('textarea','frame'); ta.spellcheck=false; ta.value=opts.content||'';
    wireFrame(ta, v);
    body.appendChild(ta); v.textarea = ta;
  }
  box.appendChild(body);
  if(opts.foot) box.appendChild(el('div','foot', opts.foot));
  track(opts.track).appendChild(box);
  viewers.push(v);
  relayout(track(opts.track));
  return v;
}

/* The text-frame mouse/keyboard model. */
function wireFrame(ta, v){
  ta.addEventListener('mousedown', function(e){
    mark(v);
    if(e.button===1){ e.preventDefault(); } // middle: suppress autoscroll; run on auxclick
  });
  ta.addEventListener('auxclick', function(e){
    if(e.button===1){ e.preventDefault(); execText(v, lineAtPoint(ta, e.clientY)); }
  });
  ta.addEventListener('keydown', function(e){
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){
      e.preventDefault();
      var s = ta.value.substring(ta.selectionStart, ta.selectionEnd).trim();
      execText(v, s || caretLine(ta));
    }
  });
}
// Which text line is under vertical coordinate y? (monospace, no wrap -> exact)
function lineAtPoint(ta, y){
  var cs=getComputedStyle(ta), lh=parseFloat(cs.lineHeight)||20, pt=parseFloat(cs.paddingTop)||0;
  var rel = y - ta.getBoundingClientRect().top - pt + ta.scrollTop;
  var idx = Math.floor(rel/lh), lines = ta.value.split('\n');
  return (idx>=0 && idx<lines.length) ? lines[idx] : '';
}
function caretLine(ta){
  var s=ta.value, p=ta.selectionStart;
  var a=s.lastIndexOf('\n',p-1)+1, b=s.indexOf('\n',p); if(b<0)b=s.length;
  return s.slice(a,b);
}
// Run a line of frame text as a command (skip blanks and comments).
function execText(v, lineText){
  var t=(lineText||'').trim();
  if(!t || t.charAt(0)==='#' || t.slice(0,2)==='::') return;
  mark(v); exec(t, v);
}

function mark(v){
  marked=v;
  viewers.forEach(function(x){ x.box.classList.toggle('marked', x===v); x.star.textContent=(x===v?'\u2737':''); });
}

/* ---- the rich Log: executable text lines + embedded dynamic objects ------- */
function wireRichLog(rl, v){
  rl.addEventListener('mousedown', function(e){ mark(v); if(e.button===1) e.preventDefault(); });
  rl.addEventListener('auxclick', function(e){
    if(e.button!==1) return;
    var ln = e.target.closest ? e.target.closest('.ln') : null;
    if(ln){ e.preventDefault(); execText(v, ln.textContent.replace(/^[\u25B8! ] ?/,'')); }
  });
}
function logView(){ return viewers.find(function(v){return v.kind==='log';}); }
function logLine(s, cls){
  var rl=logView().rich;
  var d=el('div','ln'+(cls?' '+cls:''), s);
  rl.appendChild(d); rl.scrollTop=rl.scrollHeight;
}
function appendLog(s){ String(s).replace(/\n$/,'').split('\n').forEach(function(l){ logLine(l); }); }
function logEcho(s){ logLine('\u25B8 '+s, 'echo'); }
function logOut(s, isErr){
  String(s).replace(/\n+$/,'').split('\n').forEach(function(l){ logLine((isErr?'! ':'  ')+l, isErr?'err':null); });
  logLine('');
}
/* Embed a dynamic object (an SVG drawing, a chart, an HTML report) into the Log. */
function logObj(html){
  var rl=logView().rich;
  var d=el('div','obj'); d.innerHTML=html;
  rl.appendChild(d); rl.appendChild(el('div','ln',''));
  rl.scrollTop=rl.scrollHeight;
}
function clearLog(){ logView().rich.innerHTML=''; }

/* ---- PANEL viewers: graphical front ends described in Latte --------------- */
/* A panel arrives as JSON from /api/ui (built by lib/ui.lat constructors).
   Buttons run their command with $name replaced by the panel's field values —
   so a Latte module designs its own front end and wires it to its own arms. */
function renderPanel(v, p){
  var pb=v.panelbody; pb.innerHTML='';
  var fields={};
  function build(item, into){
    if(item.t==='row'){
      var r=el('div','prow'); (item.items||[]).forEach(function(it){ build(it, r); }); into.appendChild(r); return;
    }
    if(item.t==='label'){ into.appendChild(el('span','plabel', item.text.replace(/-/g,' '))); return; }
    if(item.t==='field'){
      var inp=document.createElement('input'); inp.value=item.init||''; fields[item.name]=inp;
      into.appendChild(inp); return;
    }
    if(item.t==='button'){
      var b=document.createElement('button'); b.textContent=item.text;
      b.onclick=function(){
        var cmd=item.cmd.replace(/\$([A-Za-z0-9_]+)/g, function(_,n){ return fields[n]?fields[n].value.trim():''; });
        mark(v); exec(cmd, v);
      };
      into.appendChild(b); return;
    }
  }
  var wrap=el('div','prow'); // top row collector not needed; stack directly
  (p.items||[]).forEach(function(it){ build(it, pb); });
  void wrap;
}
function openPanel(spec){
  post('/api/ui', spec, function(out){
    try{
      var p=JSON.parse(out);
      if(p.error){ logOut('ui: '+p.error, true); return; }
      mark(makeViewer({name:(p.title||'Panel'), track:'user', kind:'panel', panel:p, menu:toolMenu,
        foot:'a graphical front end described in Latte (lib/ui.lat) — buttons call module arms'}));
    } catch(e){ logOut('ui: '+out, true); }
  });
}

/* ---- the command interpreter -------------------------------------------- */
function resolveArgs(line){
  var sel=(window.getSelection && String(window.getSelection()))||'';
  return line.replace(/\^/g, function(){ return sel.trim(); });
}
function exec(line, fromViewer){
  if(!line) return; line=line.trim();
  var sp=line.indexOf(' ');
  var headTok = sp<0?line:line.slice(0,sp);
  var rest = sp<0?'':line.slice(sp+1).trim();

  // ---- System.* : the display/OS commands (browser side) ----
  if(headTok==='System.Open'||headTok==='Edit.Open'){ logEcho(line); openModule(rest||'std'); return; }
  if(headTok==='System.Close'){ logEcho(line); closeViewer(targetViewer(rest, fromViewer)); return; }
  if(headTok==='System.Grow'){ logEcho(line); growViewer(targetViewer(rest, fromViewer)); return; }
  if(headTok==='System.Copy'){ logEcho(line); copyViewer(targetViewer(rest, fromViewer)); return; }
  if(headTok==='System.Clear'){ clearLog(); return; }
  if(headTok==='System.Modules'||headTok==='System.Sources'){ logEcho(line); refreshModules(); return; }
  if(headTok==='System.New'){ logEcho(line); newModuleViewer(rest||'mymod'); return; }
  if(headTok==='System.Chess'||headTok==='Game.Chess'){ logEcho(line); window.location='/chess'; return; }
  if(headTok==='System.Docs'||headTok==='System.Help'){ logEcho(line); window.location = rest ? ('/docs#'+rest) : '/docs'; return; }
  if(headTok==='System.Finance'||headTok==='Fin.Run'){ logEcho(line); window.location='/fin'; return; }
  if(headTok==='System.Charts'||headTok==='Chart.Open'){ logEcho(line); window.location='/chart'; return; }
  if(headTok==='System.Gpu'||headTok==='Gpu.Run'){ logEcho(line); window.location='/gpu'; return; }
  if(headTok==='System.Trade'||headTok==='Trade.Advise'){ logEcho(line); window.location='/trade'; return; }
  if(headTok==='System.Derive'||headTok==='Derive.Open'){ logEcho(line); window.location='/derive'; return; }
  // Oberon-style: a command that operates on the text after it (the selection).
  if(headTok==='System.Sentiment'||headTok==='News.Score'){
    logEcho(line);
    if(!rest){ logOut('System.Sentiment: type some headline text after the command', true); return; }
    post('/api/sentiment', rest, function(out){
      try { var j=JSON.parse(out); logOut('sentiment: polarity '+(j.polarity>=0?'+':'')+j.polarity+'  (pos '+j.positive+', neg '+j.negative+')'); }
      catch(e){ logOut(out, true); }
    });
    return;
  }

  // ---- embedded-object commands: results render INTO the Log as objects ----
  // gfx <expr|Mod.arm args> : a Latte gfx scene, rendered to SVG
  if(headTok==='gfx'||headTok==='draw'){
    logEcho(line);
    post('/api/gfx', rest, function(svg){
      if(/^\s*<svg/.test(svg)) logObj(svg); else logOut(svg, true);
    });
    return;
  }
  // chart bar|line|scatter <nums> : a chart (layout computed in lib/plot.lat)
  // chart market [days=N] [live=1] : the real price series with SMA overlays
  if(headTok==='chart'||headTok==='plot'){
    logEcho(line);
    if(/^market\b/.test(rest)){
      var body = rest.replace(/^market\s*/,'').split(/\s+/).filter(Boolean).join('\n');
      post('/api/marketchart', body, function(svg){ if(/^\s*<svg/.test(svg)) logObj(svg); else logOut(svg, true); });
    } else {
      post('/api/plot', rest, function(svg){ if(/^\s*<svg/.test(svg)) logObj(svg); else logOut(svg, true); });
    }
    return;
  }
  // ta [live=1] [win=N] : the technical-analysis verdict table (lib/ta.lat)
  if(headTok==='ta'||headTok==='indicators'){
    logEcho(line);
    post('/api/ta', rest.split(/\s+/).filter(Boolean).join('\n'), function(html){ logObj(html); });
    return;
  }
  // trade [account=N] [kelly=F] [live=1] : the full advisor report
  if(headTok==='trade'||headTok==='advise'){
    logEcho(line);
    post('/api/trade', rest.split(/\s+/).filter(Boolean).join('\n'), function(html){ logObj(html); });
    return;
  }
  // ui Mod.arm [args] : open a graphical front end described in Latte
  if(headTok==='ui'||headTok==='panel'){
    logEcho(line);
    if(!rest){ logOut('ui: name a panel arm, e.g.  ui Tool.calc', true); return; }
    openPanel(rest);
    return;
  }

  // ---- Compiler.* : edit -> compile -> run, on the running system ----
  if(headTok==='Compiler.Compile'){
    logEcho(line);
    var cv=targetViewer(rest, fromViewer);
    if(!cv||!cv.textarea){ logOut('Compiler.Compile: mark a source frame first',true); return; }
    post('/api/compile', cv.textarea.value, function(out){ logOut(out, /error/i.test(out)); refreshModules(); });
    return;
  }
  if(headTok==='Compiler.Store'||headTok==='Edit.Store'){
    logEcho(line);
    var sv=targetViewer(rest, fromViewer);
    if(!sv||!sv.textarea){ logOut('Store: mark a source frame first',true); return; }
    var name=(sv.textarea.value.match(/\bcore\s+([A-Za-z0-9_]+)/)||[])[1];
    if(!name){ logOut('Store: source has no `core NAME`',true); return; }
    post('/api/source?name='+encodeURIComponent(name), sv.textarea.value, function(out){ logOut(out, /error/i.test(out)); refreshModules(); });
    return;
  }

  // ---- everything else -> the running system (a Latte arm / tool verb) ----
  logEcho(line);
  post('/api/run', resolveArgs(line), function(out){ logOut(out, /^!|error/i.test(out)); });
}

function targetViewer(rest, fromViewer){
  rest=(rest||'').trim();
  if(rest===''||rest==='*') return marked||fromViewer;
  var nm=rest.replace(/\.Mod$/,'');
  return viewers.find(function(v){ return v.name===rest||v.name===nm||v.name===nm+'.Mod'; })||marked||fromViewer;
}

/* ---- viewer operations --------------------------------------------------- */
function closeViewer(v){
  if(!v||v.kind==='log') return;
  var tr=v.box.parentElement;
  v.box.remove(); viewers=viewers.filter(function(x){return x!==v;});
  if(marked===v) marked=null;
  if(tr) relayout(tr);
}
function growViewer(v){ if(!v) return; v.grown=!v.grown; v.box.classList.toggle('grown', v.grown); v.box.style.flexGrow=''; }
function copyViewer(v){ if(!v||!v.textarea) return; mark(makeViewer({name:v.name, track:'user', kind:'frame', content:v.textarea.value, menu:sourceMenu})); }

/* ---- opening a module's source as an editable text frame ----------------- */
function openModule(name){
  fetch('/api/source?name='+encodeURIComponent(name)).then(function(r){return r.text();}).then(function(src){
    mark(makeViewer({name:name+'.Mod', track:'user', kind:'frame', content:src, menu:sourceMenu,
      foot:'editing module `'+name+'` — Compile loads it into the running system'}));
  });
}
function newModuleViewer(name){
  var src='import std\ncore '+name+'\n  greet = fn [_] -> %hello\nend\n';
  mark(makeViewer({name:name+'.Mod', track:'user', kind:'frame', content:src, menu:sourceMenu,
    foot:'new module — edit, then Compiler.Compile'}));
}

/* ---- the loaded-module list (click a name to open its source) ------------ */
function refreshModules(){
  Promise.all([
    fetch('/api/sources').then(function(r){return r.text();}),
    fetch('/api/run',{method:'POST',headers:{'Content-Type':'text/plain'},body:'libs'}).then(function(r){return r.text();})
  ]).then(function(res){
    var names=res[0].split('\n').filter(Boolean);
    var rt=(res[1].match(/compiled:\s*(.*)/)||[])[1]||'';
    var rtset={}; rt.split(/\s+/).filter(Boolean).forEach(function(n){rtset[n]=1;});
    var md=viewers.find(function(v){return v.kind==='mods';}).mods; md.innerHTML='';
    names.forEach(function(n){
      var d=el('div','m'+(rtset[n]?' rt':''), n+(rtset[n]?'  \u00B7compiled':''));
      d.onmousedown=function(e){ if(e.button===0||e.button===1){ e.preventDefault(); openModule(n); } };
      md.appendChild(d);
    });
  });
}

function post(url, body, cb){
  fetch(url,{method:'POST',headers:{'Content-Type':'text/plain; charset=utf-8'},body:body})
    .then(function(r){return r.text();}).then(cb).catch(function(e){ cb('network error: '+e); });
}
